name: Build AnswerLens Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android source tree
        run: |
          rm -rf src
          mkdir -p src/main/java/com/example/answerlens/models
          cp AndroidManifest.xml src/main/AndroidManifest.xml
          for file in *.kt; do
            if grep -q "package com.example.answerlens.models" "$file"; then
              cp "$file" src/main/java/com/example/answerlens/models/
            else
              cp "$file" src/main/java/com/example/answerlens/
            fi
          done
          echo "Prepared source tree:"
          find src/main -type f | sort

      - name: Verify tools
        run: |
          java -version
          gradle --version
          ls -la

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          APK_PATH=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was found. Build output tree:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" out/AnswerLens-debug.apk
          ls -lh out/AnswerLens-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AnswerLens-debug-apk
          path: out/AnswerLens-debug.apk
